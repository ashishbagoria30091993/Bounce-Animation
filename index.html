<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task (8)</title>
    <style>
        .container{
            width: 100%;
            height: 400px;
            background-color: black;
            position: relative;
        }

        .box{
            width: 90px;
            height: 90px;
            background-color: yellow;
            position: absolute;
            bottom: 0px;
            left: 0px;
            border-radius: 70px;
            animation: animationX 5s linear 1s infinite,
                       animationY 1s ease-out 1s infinite alternate;       
        }

        @keyframes animationX {
            from{
                left: 0%;
            }
            to{
                left: 100%;
            }
        }

        @keyframes animationY {
            from{
                bottom: 0;
            }
            to{
                bottom: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
